[defaults]
inventory = inventory.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
result_format = yaml
display_skipped_hosts = False
forks = 5
interpreter_python = auto_silent

# Copied from ugreen-nas-compose's ansible.cfg (Task 1 of
# docs/superpowers/plans/2026-08-21-netbox-udm-sync.md). Dropped the
# `library`/`filter_plugins` path settings and the freeipa.ansible_freeipa
# deprecation-warning suppression comment that lived here — both were
# specific to ugreen-nas-compose's now-empty ansible/library,
# ansible/filter_plugins dirs and the freeipa.ansible_freeipa collection,
# neither of which this repo's seven migrated roles use. Re-add if a
# future task brings those over too.

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
pipelining = True
