[defaults]
inventory = inventory.yml
roles_path = roles
filter_plugins = filter_plugins
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
result_format = yaml
display_skipped_hosts = False
forks = 5
interpreter_python = auto_silent

# Copied from ugreen-nas-compose's ansible.cfg (Task 1 of
# docs/superpowers/plans/2026-08-21-netbox-udm-sync.md). Dropped the
# `library` path setting and the freeipa.ansible_freeipa
# deprecation-warning suppression comment that lived here — specific to
# ugreen-nas-compose's now-empty ansible/library dir and the
# freeipa.ansible_freeipa collection, neither of which this repo's
# migrated roles use. Re-add `library` if a future task brings custom
# modules over too.
#
# filter_plugins re-added by Task 3 (unifi_network_dns_record's NetBox
# rewrite): ansible/filter_plugins/netbox_sync.py isn't adjacent to
# ansible/playbooks/, so the path needs to be spelled out explicitly —
# ansible-core's automatic adjacent-directory plugin discovery only
# checks next to the playbook file itself, not the ansible/ project root.

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
pipelining = True
