---
# unifi_network_dhcp_pxe: idempotent DHCP PXE-boot reconciliation
# against the UDM Pro / UniFi Network controller's REST API.
#
# Flow:
#   1. Pre-flight assert: next_server + boot_filename are non-empty
#      (the desired payload hardcodes dhcpd_boot_enabled: true, so
#      there's no separate "enabled" knob to guard)
#   2. Resolve admin creds from 1Password (per-host fetch — see
#      cloudflare_tunnel_ingress task-2 header for the run_once-doesn't-help
#      explanation)
#   3. Authenticate (POST /api/auth/login → cookie + X-CSRF-Token)
#   4. GET /rest/networkconf, find the target network by name
#   5. Compute desired dhcpd_boot_* values, diff against current
#   6. PUT only on drift, then re-GET + assert in non-check mode

- name: "Block — UniFi DHCP PXE reconciliation"
  when: unifi_network_dhcp_pxe_enabled | bool
  block:
    - name: "Pre-flight — assert next_server + boot_filename are set"
      ansible.builtin.assert:
        that:
          - unifi_network_dhcp_pxe_next_server is string
          - unifi_network_dhcp_pxe_next_server | length > 0
          - unifi_network_dhcp_pxe_boot_filename is string
          - unifi_network_dhcp_pxe_boot_filename | length > 0
        fail_msg: |
          unifi_network_dhcp_pxe_next_server or boot_filename is empty.
          next_server defaults to truenas_netbootxyz_app_lan_ip; if that's
          unset, set unifi_network_dhcp_pxe_next_server explicitly in
          host_vars to the IP serving TFTP.

    # Per-host 1P lookup (same rationale as cloudflare_tunnel_ingress —
    # set_fact + run_once would only define the fact on the first host,
    # not subsequent ones, since facts are host-scoped).
    - name: "Fetch UniFi admin credentials from 1Password"
      ansible.builtin.set_fact:
        _udm_username: >-
          {{ lookup('community.general.onepassword',
                    unifi_network_dhcp_pxe_creds_op_item,
                    vault=unifi_network_dhcp_pxe_creds_op_vault,
                    field=unifi_network_dhcp_pxe_creds_username_field) }}
        _udm_password: >-
          {{ lookup('community.general.onepassword',
                    unifi_network_dhcp_pxe_creds_op_item,
                    vault=unifi_network_dhcp_pxe_creds_op_vault,
                    field=unifi_network_dhcp_pxe_creds_password_field) }}
      no_log: true
      delegate_to: localhost
      become: false

    # UniFi OS login. Returns:
    #   - Set-Cookie: TOKEN=<jwt>; ...
    #   - Header: X-CSRF-Token: <token>
    # Both are required for subsequent API calls. The `uri` module
    # captures Set-Cookie into the response's `cookies_string` field
    # (single header line ready to re-send), and headers come through
    # under .<resp>.x_csrf_token (lowercased + underscored).
    #
    # check_mode: false — `uri` skips non-GET requests under --check,
    # which would leave `_udm_login` empty and break the downstream
    # `cookies_string` / `x_csrf_token` reads, defeating the diff
    # preview the README/PR test plan promise. The login is read-only
    # from the operator's perspective (creates a session token on the
    # controller, doesn't change any settings), so forcing it through
    # in check mode is safe; `changed_when: false` keeps the dry-run
    # change-count honest.
    - name: "Authenticate against the UDM controller"
      ansible.builtin.uri:
        url: "{{ unifi_network_dhcp_pxe_controller_url }}/api/auth/login"
        method: POST
        body_format: json
        body:
          username: "{{ _udm_username }}"
          password: "{{ _udm_password }}"
        validate_certs: "{{ unifi_network_dhcp_pxe_validate_certs }}"
        status_code: 200
        return_content: false
      register: _udm_login
      delegate_to: localhost
      become: false
      no_log: true
      check_mode: false
      changed_when: false

    # The `uri` module exposes response headers as register attributes,
    # lowercased with hyphens → underscores. UDM's login response sets
    # `X-CSRF-Token: <token>` which surfaces here as `.x_csrf_token`.
    - name: "Capture session cookie + CSRF token"
      ansible.builtin.set_fact:
        _udm_cookie: "{{ _udm_login.cookies_string }}"
        _udm_csrf: "{{ _udm_login.x_csrf_token | default('') }}"
      no_log: true

    - name: "Assert CSRF token was returned"
      ansible.builtin.assert:
        that:
          - _udm_csrf | length > 0
        fail_msg: |
          UDM login succeeded but no X-CSRF-Token header came back. UniFi
          OS versions before ~2.5 returned this on every response; very
          new versions may have changed the auth flow. Check the response
          headers manually:
            curl -ks {{ unifi_network_dhcp_pxe_controller_url }}/api/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"username":"...","password":"..."}' -i
          and adjust this role's header capture if the field name changed.

    - name: "GET current network configurations"
      ansible.builtin.uri:
        url: "{{ unifi_network_dhcp_pxe_controller_url }}/proxy/network/api/s/{{ unifi_network_dhcp_pxe_site }}/rest/networkconf"
        method: GET
        headers:
          Cookie: "{{ _udm_cookie }}"
          X-CSRF-Token: "{{ _udm_csrf }}"
        validate_certs: "{{ unifi_network_dhcp_pxe_validate_certs }}"
        status_code: 200
        return_content: true
      register: _udm_networks
      delegate_to: localhost
      become: false
      no_log: true

    - name: "Find the target network by display name"
      ansible.builtin.set_fact:
        _udm_matching_networks: >-
          {{ _udm_networks.json.data
             | selectattr('name', 'equalto', unifi_network_dhcp_pxe_target_network_name)
             | list }}

    - name: "Assert exactly one matching network"
      ansible.builtin.assert:
        that:
          - _udm_matching_networks | length == 1
        fail_msg: |
          Expected exactly one network named
          '{{ unifi_network_dhcp_pxe_target_network_name }}' on site
          '{{ unifi_network_dhcp_pxe_site }}', found
          {{ _udm_matching_networks | length }}.

          Available networks:
            {{ _udm_networks.json.data | map(attribute='name') | list }}

          Set `unifi_network_dhcp_pxe_target_network_name` to one of the
          above (case-sensitive). If the site identifier is wrong, set
          `unifi_network_dhcp_pxe_site` (default "default") to whatever
          appears in the UDM UI URL bar: /manage/site/<this>/dashboard.

    - name: "Note the target network's ID + current PXE fields"
      ansible.builtin.set_fact:
        _udm_network_id: "{{ _udm_matching_networks[0]._id }}"
        _udm_current_pxe:
          dhcpd_boot_enabled: "{{ _udm_matching_networks[0].dhcpd_boot_enabled | default(false) }}"
          dhcpd_boot_server: "{{ _udm_matching_networks[0].dhcpd_boot_server | default('') }}"
          dhcpd_boot_filename: "{{ _udm_matching_networks[0].dhcpd_boot_filename | default('') }}"

    - name: "Compute desired PXE field values"
      ansible.builtin.set_fact:
        _udm_desired_pxe:
          dhcpd_boot_enabled: true
          dhcpd_boot_server: "{{ unifi_network_dhcp_pxe_next_server }}"
          dhcpd_boot_filename: "{{ unifi_network_dhcp_pxe_boot_filename }}"

    - name: "Decide if a PUT is needed"
      ansible.builtin.set_fact:
        _udm_pxe_needs_update: "{{ _udm_current_pxe != _udm_desired_pxe }}"

    - name: "Show PXE diff (especially useful in --check mode)"
      ansible.builtin.debug:
        msg:
          - "Network: {{ unifi_network_dhcp_pxe_target_network_name }} (id: {{ _udm_network_id }})"
          - "Current PXE: {{ _udm_current_pxe }}"
          - "Desired PXE: {{ _udm_desired_pxe }}"
          - "Update needed: {{ _udm_pxe_needs_update }}"

    # UniFi controller's PUT on /rest/networkconf/<id> accepts partial
    # bodies — only the supplied fields are updated, the rest of the
    # network config is preserved. This is well-documented behavior on
    # UniFi 6.x → 9.x. We deliberately do NOT round-trip the whole
    # network config to avoid accidentally re-writing fields the role
    # doesn't manage (VLANs, gateway IPs, DNS forwarders).
    - name: "PUT updated PXE fields"
      ansible.builtin.uri:
        url: "{{ unifi_network_dhcp_pxe_controller_url }}/proxy/network/api/s/{{ unifi_network_dhcp_pxe_site }}/rest/networkconf/{{ _udm_network_id }}"
        method: PUT
        headers:
          Cookie: "{{ _udm_cookie }}"
          X-CSRF-Token: "{{ _udm_csrf }}"
        body_format: json
        body: "{{ _udm_desired_pxe }}"
        validate_certs: "{{ unifi_network_dhcp_pxe_validate_certs }}"
        status_code: [200, 201]
        return_content: false
      register: _udm_put_result
      when: _udm_pxe_needs_update | bool
      delegate_to: localhost
      become: false
      no_log: true
      changed_when: _udm_pxe_needs_update | bool

    # Re-query to confirm the PUT actually persisted. Same check-mode
    # rationale as cloudflare_tunnel_ingress: `uri` is a no-op for
    # non-GET methods under --check, so a verify-and-assert here would
    # always fail in dry-run when drift exists. Gate on
    # `not ansible_check_mode` to keep --check as a clean diff preview.
    - name: "Re-query the network to verify PUT took effect"
      ansible.builtin.uri:
        url: "{{ unifi_network_dhcp_pxe_controller_url }}/proxy/network/api/s/{{ unifi_network_dhcp_pxe_site }}/rest/networkconf/{{ _udm_network_id }}"
        method: GET
        headers:
          Cookie: "{{ _udm_cookie }}"
          X-CSRF-Token: "{{ _udm_csrf }}"
        validate_certs: "{{ unifi_network_dhcp_pxe_validate_certs }}"
        status_code: 200
        return_content: true
      register: _udm_verify
      when:
        - _udm_pxe_needs_update | bool
        - not ansible_check_mode
      delegate_to: localhost
      become: false
      no_log: true

    - name: "Assert the new PXE config took effect"
      ansible.builtin.assert:
        that:
          - (_udm_verify.json.data[0].dhcpd_boot_enabled | default(false)) == _udm_desired_pxe.dhcpd_boot_enabled
          - (_udm_verify.json.data[0].dhcpd_boot_server | default('')) == _udm_desired_pxe.dhcpd_boot_server
          - (_udm_verify.json.data[0].dhcpd_boot_filename | default('')) == _udm_desired_pxe.dhcpd_boot_filename
        fail_msg: |
          PUT returned 200 but the subsequent GET shows different PXE
          values. Inspect the network in the UniFi controller UI manually.
          Sometimes a "Save" race with a concurrent UI edit can cause this;
          re-run the playbook.
      when:
        - _udm_pxe_needs_update | bool
        - not ansible_check_mode

    # Best-effort logout to invalidate the session token immediately
    # rather than waiting for it to expire. Don't fail the role if
    # logout fails — the role's primary work (PXE reconciliation) is
    # already done. check_mode: false so --check runs also clean up
    # after themselves (symmetric with the login force-run above);
    # `failed_when: false` swallows any error regardless.
    - name: "Logout (best-effort session cleanup)"
      ansible.builtin.uri:
        url: "{{ unifi_network_dhcp_pxe_controller_url }}/api/auth/logout"
        method: POST
        headers:
          Cookie: "{{ _udm_cookie }}"
          X-CSRF-Token: "{{ _udm_csrf }}"
        validate_certs: "{{ unifi_network_dhcp_pxe_validate_certs }}"
        status_code: [200, 204]
      delegate_to: localhost
      become: false
      failed_when: false
      no_log: true
      check_mode: false
      changed_when: false
