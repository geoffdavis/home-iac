---
# netbox_import_udm_state: ONE-SHOT backfill of NetBox's ipam.IPAddress
# objects from the UDM's live static-DNS list plus the documented VLAN 10
# "low address" list (personal-notes: "Agent Access and Deploy Coordination
# .md", section 5, the pacificbeach data point). See
# docs/superpowers/plans/2026-08-21-netbox-udm-sync.md, Task 2, and
# docs/superpowers/specs/2026-08-21-netbox-udm-sync-design.md, "Phase 1
# import" / "Data model in NetBox".
#
# This role is idempotent (GET -> diff -> create/update, same shape as
# unifi_network_dns_record) but it is meant to be RUN ONCE (or re-run by
# hand if the UDM's static-DNS state drifts before Task 3's ongoing sync
# takes over writing to the UDM). It never deletes anything from NetBox.

# --- NetBox connection -------------------------------------------------
# Same host as ../../../hosts/nas-sdg/apps/netbox.nix. Reached over VLAN 10
# by IP + explicit Host header, NOT the netbox.mgmt.home.geoffdavis.com
# name -- that UDM static-DNS record exists now (confirmed live
# 2026-08-24) but this role has no reason to depend on UDM DNS resolving
# correctly on the machine running ansible-playbook; the IP + Host header
# is what netbox.nix's own ALLOWED_HOSTS validation actually requires
# (Django rejects a Host header it doesn't recognize -- ALLOWED_HOSTS is
# "netbox.mgmt.home.geoffdavis.com 127.0.0.1", so hitting the IP with no
# Host override 400s).
netbox_import_udm_state_netbox_url: "http://172.29.10.20:8080"
netbox_import_udm_state_netbox_host_header: "netbox.mgmt.home.geoffdavis.com"

# 1Password lookup for the WRITE-SCOPED backfill token -- deliberately its
# own item, separate from both the NetBox superuser bootstrap token
# ("nas-sdg netbox" in this same vault, used only for nix-personal's own
# provisioning) and the read-only token Task 3's ongoing sync will use.
# NetBox v4.6+ tokens are minted with a `write_enabled` flag independent of
# the underlying user's own permissions -- this token should be created
# with write_enabled=true; Task 3's future token should be write_enabled
# =false against the same (or an equally-scoped) account. See this role's
# README for exactly how to mint it; it does NOT exist yet as of this
# commit -- creating it is a manual, one-time step a human has to do
# before this role can actually run (see README "Before running this
# role").
netbox_import_udm_state_netbox_token_op_item: "netbox-udm-import-token"
netbox_import_udm_state_netbox_token_op_vault: "nas-overlay"
netbox_import_udm_state_netbox_token_op_field: "token"

# --- UDM connection ------------------------------------------------------
# Identical to unifi_network_dns_record's defaults -- same controller, same
# site, same credential. Deliberately NOT overridden per-host here: this
# role reads UDM state exactly once per run, it is not a per-host loop.
netbox_import_udm_state_udm_controller_url: "https://172.29.50.1"
netbox_import_udm_state_udm_validate_certs: false
netbox_import_udm_state_udm_site: "default"
netbox_import_udm_state_udm_creds_op_item: "UniFi UDM Pro (ansible)"
netbox_import_udm_state_udm_creds_op_vault: "Automation"
netbox_import_udm_state_udm_creds_username_field: "username"
netbox_import_udm_state_udm_creds_password_field: "password"

# --- external-dns ownership filter ---------------------------------------
# pi-talos-home-ops's external-dns writes ownership TXT records shaped
# "_externaldns.a-<name>" -> "...heritage=external-dns...". Any A/AAAA
# record whose key matches one of these (after stripping the prefix) is
# Kubernetes/Cilium-owned, not static desired state, and must NOT be
# imported into NetBox as though it were -- see the design doc's "Ownership
# filter" section: if NetBox ever holds a record with the same key+type as
# something external-dns manages, Task 3's future reconciler would
# overwrite a live Kubernetes-owned DNS record the moment it ran. Applying
# the same exclusion one phase early, during the backfill, is strictly
# safer than importing now and trusting Task 3 to filter it out later.
# Confirmed live 2026-08-24: this excludes website-dev.k8s, website-prod
# .k8s and hubble.k8s (all -> 172.29.55.0, the Cilium LB pool's network
# address, not a real host -- consistent with host_vars/nas-sdg.yml's
# existing "SUSPECT, captured as-found" comment on those same two names).
netbox_import_udm_state_externaldns_txt_prefix: "_externaldns.a-"

# --- VLAN -> IPv4 prefix length lookup ------------------------------------
# Every routed VLAN in this fleet is a /24 (topology note: "<site-prefix>.
# <vlan>.0/24 -- third octet = VLAN ID"). Keyed on the address's first
# three octets (with a trailing dot) so the lookup is a plain dict hit, no
# regex. Anything NOT in this table (e.g. the netbird overlay's
# 100.92.0.0/? -- its real supernet isn't confirmed anywhere this role can
# cite) falls back to /32: a single-host claim is always safe, whereas
# guessing a supernet that turns out wrong would misrepresent NetBox's
# IPAM data, which is exactly the correctness NetBox exists to provide.
netbox_import_udm_state_vlan_prefix_lengths:
  "172.29.10.": 24 # Management
  "172.29.20.": 24 # Security
  "172.29.30.": 24 # Private
  "172.29.50.": 24 # IoT
  "172.29.51.": 24 # K8S

# --- Documented "low address" supplement (VLAN 10 only) ------------------
# personal-notes: "Agent Access and Deploy Coordination.md", section 5 --
# the pacificbeach data point: ".31 was clear of every other low static
# address (.1 gateway, .5/.6 JetKVMs, .11-.13 Talos, .20 nas-sdg, .30
# tourmaline)" -- and "[[Home Network Topology]]"'s VLAN 10 row, same list
# plus torrey (.145) and rpi4-mgmt (.226). This is the literal "documented
# low-address list" the plan's Task 2 Step 4 points at.
#
# .20 (nas-sdg), .30 (tourmaline) and .31 (pacificbeach) are deliberately
# NOT repeated here -- they already get a NetBox object (with the right
# dns_name) from the static-DNS import above, because all three have a
# real UDM static-DNS A record. Listing them again here would just create
# a second, redundant desired-state entry for the same address; the role's
# merge step also defensively de-dupes by address in case that ever
# changes.
#
# `status` and `dns_name` below are NOT guesses: cross-checked live
# 2026-08-24 against the UDM's rest/networkconf (VLAN 10 DHCP pool is
# .101-.250, confirming the topology note's pool bounds are still
# accurate) and stat/sta (active clients) -- `status: dhcp` where the live
# client record has use_fixedip=true (a real UDM DHCP reservation, using
# the same status value the design doc's Data model section specifies for
# "static reservations"), `status: active` where it does not (torrey and
# the gateway have no client entry with use_fixedip at all -- torrey is a
# plain static host-side config, same as pacificbeach). `dns_name` values
# for the fixed-IP clients follow the confirmed <hostname>.mgmt.home.
# geoffdavis.com pattern (proven exactly, live, for talos-pi5-02 -- the
# only one of these clients whose reported hostname already included the
# suffix; the rest report short hostnames, so the suffix here is inferred
# from that one confirmed example plus nas-sdg/tourmaline/pacificbeach's
# existing static-DNS records, all of which follow the same
# "<name>.mgmt.home.geoffdavis.com" shape). Worth a human glance, not a
# guess made from nothing -- correcting a wrong dns_name here later is a
# one-line NetBox edit, not a re-import.
netbox_import_udm_state_low_addresses:
  - address: "172.29.10.1"
    dns_name: ""
    status: "active"
    description: "UDM gateway (VLAN 10 Management)"
  - address: "172.29.10.5"
    dns_name: "jetkvm-01.mgmt.home.geoffdavis.com"
    status: "dhcp"
    description: "jetkvm-sdg-01 -- roaming JetKVM, UDM DHCP fixed-ip reservation (confirmed live 2026-08-24)"
  - address: "172.29.10.6"
    dns_name: "jetkvm-02.mgmt.home.geoffdavis.com"
    status: "dhcp"
    description: "jetkvm-sdg-02 -- on nas-sdg, UDM DHCP fixed-ip reservation (confirmed live 2026-08-24)"
  - address: "172.29.10.11"
    dns_name: "talos-pi5-01.mgmt.home.geoffdavis.com"
    status: "dhcp"
    description: "talos-pi5-01 secondary NIC (primary traffic is VLAN 51) -- UDM DHCP fixed-ip reservation (confirmed live 2026-08-24)"
  - address: "172.29.10.12"
    dns_name: "talos-pi5-02.mgmt.home.geoffdavis.com"
    status: "dhcp"
    description: "talos-pi5-02 secondary NIC (primary traffic is VLAN 51) -- UDM DHCP fixed-ip reservation, hostname+suffix both confirmed live 2026-08-24"
  - address: "172.29.10.13"
    dns_name: "talos-pi5-03.mgmt.home.geoffdavis.com"
    status: "dhcp"
    description: "talos-pi5-03 secondary NIC (primary traffic is VLAN 51) -- UDM DHCP fixed-ip reservation (confirmed live 2026-08-24)"
  - address: "172.29.10.145"
    dns_name: "torrey.mgmt.home.geoffdavis.com"
    status: "active"
    description: "torrey (class-appliance) -- NOT a UDM DHCP fixed-ip reservation per live stat/sta (confirmed 2026-08-24), same as pacificbeach"
  - address: "172.29.10.226"
    dns_name: "rpi4-mgmt.mgmt.home.geoffdavis.com"
    status: "dhcp"
    description: "rpi4-mgmt -- UDM DHCP fixed-ip reservation (confirmed live 2026-08-24)"
