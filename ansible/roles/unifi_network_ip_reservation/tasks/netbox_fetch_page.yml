---
# netbox_fetch_page.yml — identical pagination idiom to
# unifi_network_dns_record's task of the same name (duplicated rather
# than shared, matching this repo's existing convention of self-
# contained unifi_network_* roles — see e.g. unifi_network_port_forward
# vs unifi_network_dns_record in the ugreen-nas-compose original).
#
# Reads/writes _udm_res_netbox_next_url + _udm_res_netbox_results.

- name: "GET NetBox IP-address page {{ _page_num }}"
  ansible.builtin.uri:
    url: "{{ _udm_res_netbox_next_url }}"
    method: GET
    headers:
      Authorization: "Token {{ _udm_res_netbox_token }}"
      Accept: "application/json"
    validate_certs: "{{ unifi_network_ip_reservation_netbox_validate_certs }}"
    status_code: 200
    return_content: true
  register: _udm_res_netbox_page
  delegate_to: localhost
  become: false
  no_log: true
  when: _udm_res_netbox_next_url is not none

- name: "Accumulate NetBox results + advance pagination cursor"
  ansible.builtin.set_fact:
    _udm_res_netbox_results: "{{ _udm_res_netbox_results + _udm_res_netbox_page.json.results }}"
    _udm_res_netbox_next_url: "{{ _udm_res_netbox_page.json.next }}"
  no_log: true
  when: _udm_res_netbox_next_url is not none
