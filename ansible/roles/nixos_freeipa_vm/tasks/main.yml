---
# Entry point for the nixos_freeipa_vm role — the NixOS/libvirt sibling of
# truenas_freeipa_vm. Order is load-bearing: preflight asserts
# preconditions BEFORE any state-changing call; provision_vm fetches
# secrets and creates the domain; wait_reachable blocks until the VM is
# ready for the freeipa-install playbook.
- name: Include preflight checks
  ansible.builtin.include_tasks: preflight.yml

- name: Provision the libvirt domain (idempotent)
  ansible.builtin.include_tasks: provision_vm.yml

- name: Wait for the VM to be reachable + cloud-init done
  ansible.builtin.include_tasks: wait_reachable.yml
