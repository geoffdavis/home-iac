---
# unifi_network_dns_record: idempotent static-DNS reconciliation
# against the UDM Pro / UniFi Network controller's v2 REST API.
#
# Flow:
#   1. Pre-flight assert: records list is non-empty and well-formed
#   2. Resolve admin creds from 1Password
#   3. Authenticate (POST /api/auth/login → cookie + X-CSRF-Token)
#   4. GET /v2/api/site/<site>/static-dns (all existing records —
#      NOTE: bare JSON array, no v1 {data: [...]} envelope)
#   5. For each record in unifi_network_dns_record_records:
#        - state=present: POST (create) or PUT (update on drift)
#        - state=absent:  DELETE if found, no-op if already absent
#   6. Best-effort logout

- name: "Block — UniFi static-DNS reconciliation"
  when: unifi_network_dns_record_enabled | bool
  block:
    - name: "Pre-flight — assert records list is a non-empty list of mappings"
      ansible.builtin.assert:
        that:
          - unifi_network_dns_record_records is sequence
          - unifi_network_dns_record_records is not string
          - unifi_network_dns_record_records is not mapping
          - unifi_network_dns_record_records | length > 0
          - (unifi_network_dns_record_records | selectattr('record_type', 'undefined') | list | length) == 0
          - (unifi_network_dns_record_records | selectattr('key', 'undefined') | list | length) == 0
          - (unifi_network_dns_record_records | selectattr('value', 'undefined') | list | length) == 0
        fail_msg: |
          unifi_network_dns_record_records must be a non-empty list of mappings,
          each with at least: record_type, key, value.

    - name: "Fetch UniFi admin credentials from 1Password"
      ansible.builtin.set_fact:
        _udm_dns_username: >-
          {{ lookup('community.general.onepassword',
                    unifi_network_dns_record_creds_op_item,
                    vault=unifi_network_dns_record_creds_op_vault,
                    field=unifi_network_dns_record_creds_username_field) }}
        _udm_dns_password: >-
          {{ lookup('community.general.onepassword',
                    unifi_network_dns_record_creds_op_item,
                    vault=unifi_network_dns_record_creds_op_vault,
                    field=unifi_network_dns_record_creds_password_field) }}
      no_log: true
      delegate_to: localhost
      become: false

    - name: "Authenticate against the UDM controller"
      ansible.builtin.uri:
        url: "{{ unifi_network_dns_record_controller_url }}/api/auth/login"
        method: POST
        body_format: json
        body:
          username: "{{ _udm_dns_username }}"
          password: "{{ _udm_dns_password }}"
        validate_certs: "{{ unifi_network_dns_record_validate_certs }}"
        status_code: 200
        return_content: false
      register: _udm_dns_login
      delegate_to: localhost
      become: false
      no_log: true
      check_mode: false
      changed_when: false

    - name: "Capture session cookie + CSRF token"
      ansible.builtin.set_fact:
        _udm_dns_cookie: "{{ _udm_dns_login.cookies_string }}"
        _udm_dns_csrf: "{{ _udm_dns_login.x_csrf_token | default('') }}"
      no_log: true

    - name: "Assert CSRF token was returned"
      ansible.builtin.assert:
        that:
          - _udm_dns_csrf | length > 0
        fail_msg: |
          UDM login succeeded but no X-CSRF-Token header came back.
          Check the auth flow manually:
            curl -ks {{ unifi_network_dns_record_controller_url }}/api/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"username":"...","password":"..."}' -i

    # check_mode: false — same rationale as the login task above: `uri`
    # skips non-GET requests under --check, but ALSO skips a plain GET
    # unless forced. Without this, --check crashes reconcile_one.yml
    # (_udm_dns_existing.json doesn't exist on the empty skip-stub result)
    # before it ever gets to compute a diff — found live during home-iac
    # migration Task 1 Step 6 dry-run verification (see
    # docs/superpowers/plans/2026-08-21-netbox-udm-sync.md); the read
    # itself changes nothing on the controller, so forcing it through in
    # check mode is safe.
    - name: "GET current static DNS records"
      ansible.builtin.uri:
        url: "{{ unifi_network_dns_record_controller_url }}/proxy/network/v2/api/site/{{ unifi_network_dns_record_site }}/static-dns"
        method: GET
        headers:
          Cookie: "{{ _udm_dns_cookie }}"
          X-CSRF-Token: "{{ _udm_dns_csrf }}"
        validate_certs: "{{ unifi_network_dns_record_validate_certs }}"
        status_code: 200
        return_content: true
      register: _udm_dns_existing
      delegate_to: localhost
      become: false
      no_log: true
      check_mode: false

    - name: "Reconcile each static DNS record"
      ansible.builtin.include_tasks: reconcile_one.yml
      loop: "{{ unifi_network_dns_record_records }}"
      loop_control:
        loop_var: _udm_dns_record
        label: "{{ _udm_dns_record.record_type }} {{ _udm_dns_record.key }} ({{ _udm_dns_record.state | default('present') }})"

    - name: "Logout (best-effort session cleanup)"
      ansible.builtin.uri:
        url: "{{ unifi_network_dns_record_controller_url }}/api/auth/logout"
        method: POST
        headers:
          Cookie: "{{ _udm_dns_cookie }}"
          X-CSRF-Token: "{{ _udm_dns_csrf }}"
        validate_certs: "{{ unifi_network_dns_record_validate_certs }}"
        status_code: [200, 204]
      delegate_to: localhost
      become: false
      failed_when: false
      no_log: true
      check_mode: false
      changed_when: false
