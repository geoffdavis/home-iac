---
# unifi_network_dns_record: idempotent management of static DNS records
# on a UDM Pro / UniFi Network controller via the REST API. Runs
# entirely controller-side (delegate_to: localhost).
#
# Mirrors the unifi_network_port_forward role's structure: same UDM auth
# flow (cookie + CSRF), same GET→diff→mutate pattern, same 1Password
# credential lookup convention. One API difference: static DNS lives
# under the *v2* API (/proxy/network/v2/api/site/<site>/static-dns),
# whose list endpoint returns a bare JSON array instead of the v1
# {data: [...]} envelope.
#
# Task 3 of docs/superpowers/plans/2026-08-21-netbox-udm-sync.md: the
# desired-record list (set A) can now come from NetBox instead of the
# static unifi_network_dns_record_records list below, via
# unifi_network_dns_record_source. The comparison against the UDM's
# current state (set B) is a full symmetric set diff, not a
# one-directional walk -- see README "Sync model".

# Opt-in per host. Default false so hosts with no DNS-record
# requirements inherit a no-op.
unifi_network_dns_record_enabled: false

# Controller base URL. Shares the default with unifi_network_port_forward.
unifi_network_dns_record_controller_url: "https://172.29.50.1"

# Cert validation. UDM Pro ships with a self-signed cert by default.
unifi_network_dns_record_validate_certs: false

# UniFi site identifier.
unifi_network_dns_record_site: "default"

# 1Password lookup for the controller's admin credentials. Shares the
# same item as the other unifi_network_* roles — a single "Limited
# Admin" UniFi account covers them all.
unifi_network_dns_record_creds_op_item: "UniFi UDM Pro (ansible)"
unifi_network_dns_record_creds_op_vault: "Automation"
unifi_network_dns_record_creds_username_field: "username"
unifi_network_dns_record_creds_password_field: "password"

# --- Desired-state source ---------------------------------------------
#
# "static" (default): use unifi_network_dns_record_records verbatim,
# exactly as before Task 3. "netbox": query NetBox's ipam.IPAddress
# objects for the record list every run instead.
#
# Defaults to "static" deliberately -- this is a live, currently-running
# role (nas-sdg's host_vars sets a real unifi_network_dns_record_records
# list today), and Task 3 Step 7 (Gate G3: --check against a backfilled
# NetBox, zero diffs) is the thing that earns the right to flip a given
# host's host_vars to source: netbox, not a change to this default.
# Retired by plan Task 6 once every host that needs this role has made
# that switch.
unifi_network_dns_record_source: "static"

# List of static DNS records to reconcile (source: static only). Each
# entry:
#
#   record_type: string — "A" | "AAAA" | "CNAME" | "MX" | "TXT" | ...
#   key:         string — the record's FQDN (idempotency key, with
#                         record_type)
#   value:       string — record target (IP for A, hostname for CNAME, ...)
#   enabled:     bool   — default true
#   state:       string — "present" (default) or "absent"
#
# Identity for idempotency is key + record_type (the v2 schema has no
# name/description field). value + enabled are compared for drift.
#
# Example — publish the central syslog endpoint in the UDM zone:
#   unifi_network_dns_record_records:
#     - record_type: CNAME
#       key: syslog.home.geoffdavis.com
#       value: nas-sdg.iot.home.geoffdavis.com
unifi_network_dns_record_records: []

# --- NetBox connection (source: netbox only) --------------------------
# Same host as ../../../hosts/nas-sdg/apps/netbox.nix (nix-personal).
# Reached over VLAN 10 by IP + explicit Host header, not the
# netbox.mgmt.home.geoffdavis.com name -- matches netbox_import_udm_state
# and netbox_inventory.yml's own reasoning: this role has no business
# depending on UDM DNS resolving correctly on the machine running
# ansible-playbook, and ALLOWED_HOSTS on the container rejects a Host
# header it doesn't recognize either way.
unifi_network_dns_record_netbox_url: "http://172.29.10.20:8080"
unifi_network_dns_record_netbox_host_header: "netbox.mgmt.home.geoffdavis.com"
unifi_network_dns_record_netbox_validate_certs: true

# Read-only NetBox API token, 1Password-sourced. Deliberately the SAME
# read-only token ansible/netbox_inventory.yml already uses (both are
# read-only automation reads against NetBox; there is no privilege
# distinction that would justify a second token) -- but a genuinely
# DIFFERENT item than netbox_import_udm_state's / netbox_import_udm_
# dns_records's write-scoped backfill tokens (design spec Credentials:
# "two separate tokens, not one" -- this ongoing sync must never hold
# write access to NetBox). Live-verified 2026-08-26 (this rework, Task
# 8 Step 5) that this same read-only token DOES have read access to
# netbox_dns.* object types -- it was never re-scoped for the plugin,
# but NetBox's default read permission model on this instance turned
# out not to need it re-scoped either; confirmed with a direct GET
# against /api/plugins/netbox-dns/records/ before trusting it here.
unifi_network_dns_record_netbox_token_op_item: "netbox-ansible-inventory-token"
unifi_network_dns_record_netbox_token_op_vault: "nas-overlay"
unifi_network_dns_record_netbox_token_op_field: "token"

# netbox-dns Record list endpoint (plan Task 8 Step 5) -- supersedes the
# ipam.IPAddress fallback this role used before the plugin was installed
# and backfilled (Task 8 Steps 1-3). Record is netbox-dns's first-class
# DNS-record object (arbitrary type, arbitrary string value), which is
# what removes the fallback's A/AAAA-only, IPAM-address-only
# limitations -- see netbox_dns_records_to_udm in
# filter_plugins/netbox_sync.py for the full transform and its
# empirically-verified field assumptions. Filtered server-side to the
# zone resolved by name below (zone id looked up live, not hardcoded,
# for portability -- see the "Resolve netbox-dns zone id" task in
# tasks/main.yml).
unifi_network_dns_record_netbox_records_endpoint: "/api/plugins/netbox-dns/records/"
# Safety cap on paginated NetBox GETs (limit=200/page below) -- raise if
# this zone ever exceeds ~4000 records.
unifi_network_dns_record_netbox_page_limit: 200
unifi_network_dns_record_netbox_max_pages: 20

# Dual purpose (source: netbox): (1) the netbox-dns Zone NAME this sync
# resolves to a zone id live via GET
# /api/plugins/netbox-dns/zones/?name=<this> (tasks/main.yml, "Resolve
# netbox-dns zone id") -- deliberately not a hardcoded id, unlike
# netbox_import_udm_dns_records's defaults, for portability if this
# role is ever pointed at a second host/zone; and (2) the suffix used to
# scope "current UDM state" (set B) to records this sync actually owns,
# not every static-DNS record on the controller regardless of origin.
# Both meanings describe the same real-world zone, so one var covers
# both rather than risking two that could drift apart.
unifi_network_dns_record_managed_zone_suffix: "home.geoffdavis.com"

# external-dns ownership marker this role must never touch (design doc,
# "Ownership filter, and where it actually has to live"). Any UDM TXT
# record whose value contains this substring marks its sibling name as
# Kubernetes-owned; such names are excluded from both set A and set B
# before comparison, so this sync can never propose creating, updating,
# OR reporting-as-orphan a name external-dns manages, even if NetBox
# happens to hold a conflicting record with the same key+type. Confirmed
# live 2026-08-24 against the real UDM static-DNS list (Task 2 backfill
# investigation): excludes website-dev.k8s.home.geoffdavis.com,
# website-prod.k8s.home.geoffdavis.com, hubble.k8s.home.geoffdavis.com.
unifi_network_dns_record_external_dns_heritage_marker: "heritage=external-dns"
