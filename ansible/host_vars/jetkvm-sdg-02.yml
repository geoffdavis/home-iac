---
# host_vars/jetkvm-sdg-02.yml
#
# jetkvm-sdg-02 is the console bolted permanently to nas-sdg (jetkvm-sdg-01
# is the roaming rack unit the patch panel keeps borrowing — see the oob_kvm
# comment in inventory.yml; do not assume "the sdg console" means -01).
#
# ── THE ONLY CONSOLE WITH AN ARMED FREEZE CATCHER ─────────────────────────
#
# nas-sdg freezes with no evidence: the journal cuts mid-line, there is no
# kernel output, efi_pstore is empty every time, and the IT87 hardware
# watchdog resets the box about 120 seconds later. It froze TEN times in the
# 24h to 2026-09-11 (confirmed against its own boot list: 11 boots between
# Sep 10 17:00 and Sep 11 18:16).
#
# The only way to get evidence is to send Magic SysRq from this console's
# emulated keyboard inside that ~120s window. jetkvm_freeze_catcher does
# that, and Alt+SysRq+C HARD-CRASHES the box on purpose — a forced panic is
# what makes kmsg_dump write the ring-buffer tail into efi_pstore, which
# survives the reset.
#
# nas-sct and nas-cin are NOT freezing and must not get an armed catcher, so
# the role default stays false and only this file turns it on.
#
# ── DISARMED 2026-09-14 ───────────────────────────────────────────────────
#
# Turned off after it fired on three DELIBERATE reboots in one evening. The
# catcher detects a freeze by probing, so it cannot tell `systemctl reboot`
# from a hang -- a planned reboot looks exactly like a freeze to it: target
# silent, witness still answering. Of its five firings, the 2026-09-12/13
# ones tracked real faults; all three on 2026-09-14 were planned reboots
# during a fleet deploy.
#
# The cost is not just a noisy log. The SysRq goes out as raw USB-HID
# keystrokes, and a host ~60s into a reboot is sitting in systemd-boot's
# menu, which CANCELS its countdown on any keypress. So each false firing
# parked nas-sdg at the generation picker until a human walked over and
# pressed Enter. On a hub that is an outage; the hardware watchdog cannot
# help, because nothing has started yet. (It also means the SysRq never
# reached a running kernel: /sys/fs/pstore was empty after every one.)
#
# There is no inhibit or maintenance switch in catcher.sh -- ARMED is an
# internal variable, not an external control -- so `enabled: false` here,
# plus `/etc/init.d/S60freeze-catcher stop` on the device, is the only way
# to silence it. Note a runtime stop alone does NOT persist: S60 restarts it
# on the JetKVM's next boot and an ansible reconcile would re-enable it,
# which is why this flag has to change too.
#
# RE-ARM IF nas-sdg STARTS FREEZING AGAIN. The evidence problem this was
# built for is real and unsolved by turning it off -- freezes still leave no
# journal, no kernel output and an empty pstore, and this console remains the
# only way to force a dump. nix-personal #670 (merged 2026-09-14: kernel pin
# revert, C-state cap, watchdog, fan control) is the change that is expected
# to stop the freezes; if it did not, this goes back to true and the
# false-positive cost gets paid until a proper inhibit exists.
jetkvm_freeze_catcher_enabled: false

# ── ADDRESSING ────────────────────────────────────────────────────────────
#
# LAN literals, and never the netbird names: measured from this device on
# 2026-09-11, `nas-sdg.netbird.cloud` times out while 172.29.50.20 answers
# its SSH banner in under a second. The catcher must also keep working when
# the overlay is down, which is precisely when you would least want it blind.
#
# Note this console is on the Management VLAN (172.29.10.6) while nas-sdg is
# on 172.29.50.20, so unlike jetkvm-sct-01 the two are NOT on one segment —
# the probe crosses the UDM. That is fine and still LAN-direct; what matters
# is that it never touches the overlay.
#
# The witness is the target's own gateway: always up, different hardware from
# the target, and on the path the probe already takes. Verified answering on
# tcp/22 from this console, 2026-09-11 (banner "SSH-2.0-", 0s).
jetkvm_freeze_catcher_target: 172.29.50.20
jetkvm_freeze_catcher_target_name: nas-sdg
jetkvm_freeze_catcher_witness: 172.29.50.1
