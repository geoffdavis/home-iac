# playbooks/jetkvm-netbird-update.yml — update netbird on the JetKVM OOB
# consoles (#207).
#
# Usage:
#   uv run ansible-playbook playbooks/jetkvm-netbird-update.yml            # latest release
#   uv run ansible-playbook playbooks/jetkvm-netbird-update.yml -e netbird_version=0.75.0
#   uv run ansible-playbook playbooks/jetkvm-netbird-update.yml --limit jetkvm-sdg-01
#   uv run ansible-playbook playbooks/jetkvm-netbird-update.yml --skip-tags update
#     # real connection, real (read-only) on-device version check, reports
#     # "deployed X -> target Y", nothing else runs -- every download/stage/
#     # swap task below is tagged `update`. Use this, not --check, to just
#     # see if an update is needed: ansible.builtin.raw doesn't support
#     # check_mode (Ansible skips such tasks entirely under --check rather
#     # than simulating them), so --check can never actually read the real
#     # on-device version here.
#
# Device constraints (see the oob_kvm inventory comment): no python → only
# `raw` runs on-device; no sftp-server → the binary travels cat-over-ssh
# from the control node; busybox wget can't HTTPS → the tarball is fetched
# on the control node; firmware updates reflash the rootfs → the play
# restores /etc/init.d/S50netbird from the /userdata pristine copy first.
#
# Deliberately NOT /userdata/netbird/apply-update.sh (that stays for
# manual LAN-side updates): live finding 2026-07-09 — updating OVER THE
# OVERLAY, a flat-out 37MB pipe saturates the KVM's little SoC, starves
# the netbird daemon, and the tunnel (carrying the very session running
# the update) drops; the killed script can strand the device mid-swap.
# So the play (a) stages the binary in 4MiB dd-seek chunks, each retried
# — chunk writes are idempotent, a tunnel flap just repeats one chunk;
# (b) sha256-verifies the staged file on-device; (c) runs the
# stop/swap/start detached from the ssh session via busybox
# start-stop-daemon -b (setsid-& raced the session teardown), so losing
# the tunnel during the restart can't kill the swap; (d) polls until the
# device is back on the new version. serial: 1 so only one console is
# mid-update at a time.
#
# Single play on purpose: the control-node fetch rides along as delegated
# tasks (guarded to effectively run once, facts parked on localhost via
# delegate_facts) so `--limit jetkvm-x` works without remembering to
# include localhost — the two-play layout broke exactly that way.
#
# Fleet-wide runs (no --limit) skip any host NetBox doesn't currently
# consider reachable: only status active/staged are targeted (allowlist,
# not denylist — new/future NetBox status values default to skipped, not
# accidentally included). As of 2026-08-27: jetkvm-sdg-01/02 active,
# jetkvm-sct-01 staged (expected up), jetkvm-cin-01 offline (the whole
# Cincinnati site is down). Without this, a fleet run against cin-01
# produced a loud SSH-unreachable failure on its very first device task
# every single time — survivable under serial: 1 without any_errors_fatal,
# but noisy enough to mask a real new failure among the expected noise.
# Gate logic lives in tasks/netbox_status_gate.yml (shared with the
# freeipa_* playbooks, which hit the same problem against nas_nixos/
# ipa_replicas) — see that file for the `status.value` hostvar-shape note.
#
# meta: end_host only ends *this* host's remaining tasks, so importing the
# gate as the very first pre_task is safe even though the control-node
# fetch below is guarded to run only once per play
# (hostvars['localhost'].nb_target is not defined): if the first host in
# serial order gets skipped, the next non-skipped host still finds
# nb_target undefined and does the once-only fetch itself — the "once"
# guard tracks localhost state, not literal host order, so skipping never
# starves it or duplicates it.
---
- name: Update netbird on the JetKVM OOB consoles
  hosts: oob_kvm
  gather_facts: false
  serial: 1
  pre_tasks:
    - name: NetBox reachability gate
      ansible.builtin.import_tasks: ../tasks/netbox_status_gate.yml
  tasks:
    # ── control-node half (first serial batch only) ──────────────────────
    - name: Resolve latest release tag from GitHub
      when:
        - netbird_version is not defined
        - hostvars['localhost'].nb_target is not defined
      delegate_to: localhost
      # check_mode: false -- a plain GET with no side effects, always safe
      # to run for real. Without this, Ansible's default check-mode
      # behavior for `uri` skips the actual request and leaves `_latest`
      # without a `.json` key, so the very next task's `_latest.json.tag_name`
      # blows up with "object of type 'dict' has no attribute 'json'" before
      # the play ever reaches the device -- caught live under --check
      # 2026-08-27, the second task in the play, every single run.
      check_mode: false
      ansible.builtin.uri:
        url: https://api.github.com/repos/netbirdio/netbird/releases/latest
        return_content: true
      register: _latest

    - name: Pin the target version + artifact dir (parked on localhost)
      when: hostvars['localhost'].nb_target is not defined
      delegate_to: localhost
      delegate_facts: true
      ansible.builtin.set_fact:
        # Inline-if, not default(): Jinja evaluates default()'s fallback
        # eagerly, which explodes on the skipped _latest register when
        # -e netbird_version= is provided (review finding).
        nb_target: >-
          {{ netbird_version if netbird_version is defined
             else (_latest.json.tag_name | regex_replace('^v', '')) }}

    # Moved ahead of the download/verify/extract block below (2026-08-28
    # live finding): those three tasks used to run unconditionally, before
    # this play even knew whether an update was needed -- every fleet-wide
    # run downloaded + verified + extracted the tarball on EVERY console,
    # even ones already on the target version. Restoring S50netbird here
    # doesn't need the tarball at all (it only needs to happen before the
    # swap/restart, not before the download), and reading the current
    # version obviously doesn't either -- so both can move ahead of the
    # `when: (_current.stdout | trim) != hostvars['localhost'].nb_target`
    # gate now applied to the download/verify/extract tasks.
    #
    # Firmware updates reflash the rootfs -- a missing init script means
    # the last firmware update ate it; restore from the pristine /userdata
    # copy BEFORE touching the binary so apply-update.sh can restart the
    # service.
    - name: Restore S50netbird if the rootfs was reflashed
      tags: [update]
      ansible.builtin.raw: |
        if [ ! -f /etc/init.d/S50netbird ]; then
          cp /userdata/netbird/S50netbird /etc/init.d/S50netbird
          echo RESTORED
        else
          echo PRESENT
        fi
      register: _s50
      changed_when: "'RESTORED' in _s50.stdout"

    # Untagged (always runs) and reads the binary directly rather than via
    # the S50netbird init script, so this is correct whether or not the
    # restore task above ran.
    - name: Read the currently deployed version
      ansible.builtin.raw: >-
        SSL_CERT_FILE=/userdata/netbird/cacert.pem
        /userdata/netbird/netbird version 2>/dev/null || echo unknown
      register: _current
      changed_when: false

    # Untagged (always runs) -- this is the answer to "is an update needed",
    # via a REAL connection and REAL (read-only) on-device version check.
    # `--skip-tags update` stops here: every task below is tagged `update`,
    # so none of the staging/swap machinery runs. This is deliberately NOT
    # Ansible's generic --check: ansible.builtin.raw declares `check_mode:
    # support: none`, and Ansible's documented behavior for that is to SKIP
    # the task entirely under --check rather than simulating it -- so the
    # version-read above would never actually run under --check, and there'd
    # be no real version to report (caught live 2026-08-27, testing
    # --check --diff against jetkvm-sdg-02: it failed even earlier, on the
    # control-node uri/get_url tasks, before ever reaching this point).
    #   uv run ansible-playbook playbooks/jetkvm-netbird-update.yml \
    #     --skip-tags update --limit jetkvm-sdg-01
    - name: Report version state
      ansible.builtin.debug:
        msg: "deployed {{ _current.stdout | trim }} → target {{ hostvars['localhost'].nb_target }}"

    - name: Create the artifact dir
      tags: [update]
      when: (_current.stdout | trim) != hostvars['localhost'].nb_target
      delegate_to: localhost
      ansible.builtin.file:
        path: "/tmp/jetkvm-netbird-{{ hostvars['localhost'].nb_target }}"
        state: directory
        mode: "0700"
      register: _scratch

    - name: Download tarball + checksums (skips when already present)
      tags: [update]
      when: (_current.stdout | trim) != hostvars['localhost'].nb_target
      delegate_to: localhost
      ansible.builtin.get_url:
        url: "https://github.com/netbirdio/netbird/releases/download/v{{ hostvars['localhost'].nb_target }}/{{ item }}"
        dest: "{{ _scratch.path }}/{{ item }}"
        mode: "0600"
        force: false
      loop:
        - "netbird_{{ hostvars['localhost'].nb_target }}_linux_armv6.tar.gz"
        - "netbird_{{ hostvars['localhost'].nb_target }}_checksums.txt"

    - name: Verify the tarball against the published checksum
      tags: [update]
      when: (_current.stdout | trim) != hostvars['localhost'].nb_target
      delegate_to: localhost
      ansible.builtin.shell:
        # POSIX sh, no `executable:` pin. This used to `set -o pipefail` and
        # pin /bin/bash to get it — which silently made the play unrunnable
        # from a NixOS control node, where /bin holds ONLY /bin/sh and bash
        # lives at an unstable profile path (live finding 2026-08-14,
        # birdrock: "No such file or directory: b'/bin/bash'").
        # Comparing the two hashes explicitly needs no pipefail: an empty
        # `expected` catches a missing/renamed checksum line, which is the
        # failure pipefail was guarding against. Neither sha256sum nor
        # shasum is guaranteed present on every controller this delegates
        # to: macOS ships shasum but not sha256sum, the nix-personal
        # nas-sdg CI runner ships sha256sum but not shasum (live finding
        # 2026-08-28, first real run of jetkvm-netbird-update.yml) — so
        # detect whichever exists rather than hardcoding one.
        cmd: |
          set -eu
          cd {{ _scratch.path | quote }}
          tarball="netbird_{{ hostvars['localhost'].nb_target }}_linux_armv6.tar.gz"
          expected=$(grep " ${tarball}$" \
            "netbird_{{ hostvars['localhost'].nb_target }}_checksums.txt" \
            | cut -d' ' -f1)
          if [ -z "$expected" ]; then
            echo "no checksum line for ${tarball}" >&2
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$tarball" | cut -d' ' -f1)
          elif command -v shasum >/dev/null 2>&1; then
            actual=$(shasum -a 256 "$tarball" | cut -d' ' -f1)
          else
            echo "neither sha256sum nor shasum found on this controller" >&2
            exit 1
          fi
          if [ "$expected" != "$actual" ]; then
            echo "checksum mismatch for ${tarball}: $expected != $actual" >&2
            exit 1
          fi
          echo "${tarball}: OK"
      changed_when: false

    # Plain tar, not ansible.builtin.unarchive: the module requires GNU tar
    # and refuses macOS bsdtar (live finding); the CLI extracts fine.
    - name: Extract the netbird binary
      tags: [update]
      when: (_current.stdout | trim) != hostvars['localhost'].nb_target
      delegate_to: localhost
      ansible.builtin.command:
        cmd: >-
          tar -xzf netbird_{{ hostvars['localhost'].nb_target }}_linux_armv6.tar.gz netbird
        chdir: "{{ _scratch.path }}"
        creates: "{{ _scratch.path }}/netbird"

    # ── device half (raw only from here down) ────────────────────────────
    - name: Stage the new binary in retryable 4MiB chunks (dd-seek over ssh)
      tags: [update]
      when: (_current.stdout | trim) != hostvars['localhost'].nb_target
      delegate_to: localhost
      vars:
        # Plain `ssh`, not Ansible's connection plugin -- doesn't see
        # ansible_ssh_common_args/ansible_ssh_private_key_file, so those
        # have to be reconstructed here explicitly (live finding
        # 2026-08-28: the CI runner's ephemeral known_hosts and dedicated
        # CI key both need restating for this to work there). Computed
        # in vars, not inline in the shell block: quotes nested inside a
        # {{ }} expression there confuse ansible.builtin.shell's
        # free-form argument splitter ("unbalanced jinja2 block or
        # quotes").
        _ssh_identity_opt: "{{ ('-i ' + ansible_ssh_private_key_file) if ansible_ssh_private_key_file is defined else '' }}"
      ansible.builtin.shell: |
        set -eu
        cd {{ _scratch.path | quote }}
        ssh_opts="-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null {{ _ssh_identity_opt }}"
        rm -rf parts && mkdir parts
        split -b 4194304 netbird parts/chunk.
        # Clear any stale staging file: dd conv=notrunc never truncates, so
        # a larger leftover from an aborted run would keep trailing bytes
        # and fail the sha256 verify (review finding — and we hit exactly
        # this stale file live).
        for try in 1 2 3; do
          if ssh $ssh_opts root@{{ ansible_host }} \
               "rm -f /userdata/netbird/netbird.new"; then
            break
          fi
          [ "$try" = 3 ] && { echo "could not clear stale staging" >&2; exit 1; }
          sleep 10
        done
        i=0
        for p in parts/chunk.*; do
          ok=0
          for try in 1 2 3 4 5; do
            if ssh $ssh_opts root@{{ ansible_host }} \
                 "dd of=/userdata/netbird/netbird.new bs=4194304 seek=$i conv=notrunc 2>/dev/null" < "$p"; then
              ok=1; break
            fi
            echo "chunk $i attempt $try failed; backing off" >&2
            sleep 15
          done
          [ "$ok" = 1 ] || { echo "chunk $i failed after retries" >&2; exit 1; }
          i=$((i+1))
        done
        echo "staged $i chunks"
      register: _stage
      changed_when: true

    # ansible.builtin.stat, not a shelled-out shasum/sha256sum: the
    # previous lookup('pipe', 'shasum -a 256 ...') ran unconditionally on
    # the controller and hit the same missing-shasum gap as the tarball
    # verify above the moment an actual update (not just --skip-tags
    # update) ran on the nas-sdg CI runner (live finding 2026-08-28).
    - name: Compute the local netbird binary's checksum
      tags: [update]
      when: (_current.stdout | trim) != hostvars['localhost'].nb_target
      delegate_to: localhost
      ansible.builtin.stat:
        path: "{{ _scratch.path }}/netbird"
        checksum_algorithm: sha256
      register: _local_netbird_stat

    - name: Verify the staged binary's checksum on-device
      tags: [update]
      when: (_current.stdout | trim) != hostvars['localhost'].nb_target
      ansible.builtin.raw: >-
        sha256sum /userdata/netbird/netbird.new
      register: _staged_sum
      changed_when: false
      failed_when: >-
        _local_netbird_stat.stat.checksum not in _staged_sum.stdout

    # Detached swap: the restart drops the overlay tunnel this very session
    # came in on, so the swap must survive the session. `setsid ... &` from
    # a raw one-liner proved flaky (the child raced the session teardown and
    # never spawned — live finding); busybox start-stop-daemon -b is the
    # reliable double-forking detach. The script is written to a file first
    # so no shell-quoting survives the ssh hop.
    - name: Stage the swap script
      tags: [update]
      when: (_current.stdout | trim) != hostvars['localhost'].nb_target
      ansible.builtin.raw: |
        cd /userdata/netbird
        chmod +x netbird.new
        ./netbird.new version >/dev/null 2>&1 || { echo "staged binary does not run"; exit 1; }
        printf '%s\n' \
          '#!/bin/sh' \
          'exec > /userdata/netbird/update.log 2>&1' \
          'cd /userdata/netbird' \
          '/etc/init.d/S50netbird stop' \
          '[ -f netbird ] && mv netbird netbird.prev' \
          'mv netbird.new netbird' \
          '/etc/init.d/S50netbird start' \
          > do-swap.sh
        chmod +x do-swap.sh
        echo "swap staged"
      register: _swapstage
      changed_when: "'swap staged' in _swapstage.stdout"
      failed_when: "'swap staged' not in _swapstage.stdout"

    - name: Swap binaries and restart netbird (detached from this session)
      tags: [update]
      when: (_current.stdout | trim) != hostvars['localhost'].nb_target
      ansible.builtin.raw: |
        start-stop-daemon -S -b -x /userdata/netbird/do-swap.sh && echo "swap dispatched"
      register: _swap
      changed_when: "'swap dispatched' in _swap.stdout"
      failed_when: "'swap dispatched' not in _swap.stdout"

    # The detached swap stops netbird before restarting it, which drops the
    # overlay tunnel this very session is running over — the next task's SSH
    # attempt can land squarely in that outage. `until`/`retries` on that
    # task only re-evaluate *completed* task results, they never retry a
    # connection failure, so an unreachable host there aborts the whole play
    # instead of continuing the serial run (review finding). Wait for the
    # transport itself to come back first — wait_for_connection tests the
    # connection plugin directly (no python module execution required), so
    # it holds on this no-python raw-only device just like everything else
    # here.
    - name: Wait for the console's SSH transport to come back after the restart
      tags: [update]
      when: (_current.stdout | trim) != hostvars['localhost'].nb_target
      ansible.builtin.wait_for_connection:
        connect_timeout: 10
        delay: 5
        sleep: 5
        # Three real updates (2026-08-28) blew through 120s, then 180s,
        # then 300s in turn -- every device had actually already come
        # back on the target version each time, this wait just wasn't
        # generous enough to see it. wait_for_connection reports `elapsed`
        # at (approximately) its own ceiling when it times out, not the
        # real reconnection time, so each prior "it came back at Ns" note
        # was actually just "it took MORE than N-ish seconds" -- there's
        # no real empirical upper bound yet, only a lower one that kept
        # climbing in lockstep with the timeout. 600s is a decisive jump
        # rather than another narrow nudge; if this still isn't enough,
        # the reconnection mechanism itself needs investigating, not this
        # number again.
        timeout: 600

    - name: Wait for the device to return on the new version
      tags: [update]
      ansible.builtin.raw: |
        export SSL_CERT_FILE=/userdata/netbird/cacert.pem
        v=$(/userdata/netbird/netbird version)
        s=$(/userdata/netbird/netbird status --daemon-addr unix:///var/run/netbird.sock 2>/dev/null | grep "Management:")
        echo "version=$v ${s:-Management: unknown}"
      register: _verify
      changed_when: false
      retries: 10
      delay: 15
      until: >-
        hostvars['localhost'].nb_target in _verify.stdout
        and 'Connected' in _verify.stdout

    - name: Result
      tags: [update]
      ansible.builtin.debug:
        msg: "{{ _verify.stdout | trim }}"
