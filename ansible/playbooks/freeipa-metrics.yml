---
# Deploys the freeipa_metrics role to every replica VM: node_exporter on
# :9100 (overlay-only reachability via firewalld zones) + ipa-healthcheck
# textfile metrics for the nas-sdg VictoriaMetrics hub (nix-personal#153
# Phase 3). Idempotent; safe to re-run anytime.
#
# Usage:
#   cd ansible && uv run ansible-playbook -i inventory.yml \
#     playbooks/freeipa-metrics.yml --private-key ~/.ssh/op-ansible-ssh-key.pub
#
# Skips any replica NetBox doesn't currently consider reachable (status
# other than active/staged) before connecting — see
# tasks/netbox_status_gate.yml.

- name: FreeIPA replica metrics (node_exporter + ipa-healthcheck)
  hosts: ipa_replicas
  become: true
  gather_facts: false
  pre_tasks:
    - name: NetBox reachability gate
      ansible.builtin.import_tasks: ../tasks/netbox_status_gate.yml
  roles:
    - freeipa_metrics
