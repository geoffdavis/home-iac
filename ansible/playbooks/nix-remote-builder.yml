---
# Provision the fleet's non-NixOS nix remote builders (group `nix_builders`).
#
# Today that is amd-halo alone — the AMD Ryzen AI Developer Platform box.
# The NixOS builders (nas-sdg, nas-sct, torrey, tourmaline) are configured
# declaratively in the nix-personal repo instead; this play exists for the
# hosts nix cannot configure itself.
#
# The CLIENT half — buildMachines entries, speedFactor, the
# /etc/nix/builder_ed25519 credential — lives in nix-personal
# (modules/talos-builders.nix is the pattern for a non-NixOS builder). This
# repo only owns the endpoint.
#
# Usage (static inventory: amd-halo is not a NetBox-tagged device):
#   task ansible:run-static -- playbooks/nix-remote-builder.yml
#
# Dry run:
#   task ansible:run-static -- playbooks/nix-remote-builder.yml --check --diff
#
# Idempotent; safe to re-run. gather_facts stays TRUE — the role gates on
# ansible_pkg_mgr/ansible_service_mgr, because this platform reports its own
# product name as ansible_os_family rather than "Debian".

- name: Nix ssh-ng remote build endpoints (non-NixOS hosts)
  hosts: nix_builders
  become: true
  gather_facts: true
  roles:
    # ORDER MATTERS. netbird_peer must land first: nix_remote_builder's
    # cache-push destination is nas-sdg's OVERLAY name, which does not
    # resolve on a host that is not yet a peer. Enrolling second would
    # write a hook that fails every push until the next run.
    #
    # netbird_peer is fleet-generic — nothing about it is builder-specific.
    # It lives in this play because amd-halo is the only non-NixOS peer
    # today; give it its own play when a second, non-builder one appears.
    - netbird_peer
    - nix_remote_builder
