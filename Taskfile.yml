version: '3'

vars:
  ENVIRONMENT: '{{.ENVIRONMENT | default "home"}}'
  TF_DIR: 'environments/{{.ENVIRONMENT}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list-all

  init:
    desc: Initialize OpenTofu
    dir: '{{.TF_DIR}}'
    cmds:
      - op run --env-file ../../.env -- tofu init

  plan:
    desc: Plan changes
    dir: '{{.TF_DIR}}'
    cmds:
      - op run --env-file ../../.env -- tofu plan -out=tfplan

  apply:
    desc: Apply planned changes
    dir: '{{.TF_DIR}}'
    cmds:
      - op run --env-file ../../.env -- tofu apply tfplan
    preconditions:
      - sh: test -f tfplan
        msg: "No plan file found. Run 'task plan' first."

  destroy:
    desc: Destroy all managed infrastructure
    dir: '{{.TF_DIR}}'
    prompt: This will destroy all infrastructure. Are you sure?
    cmds:
      - op run --env-file ../../.env -- tofu destroy

  fmt:
    desc: Format all Terraform files
    cmds:
      - tofu fmt -recursive .

  validate:
    desc: Validate Terraform configuration
    dir: '{{.TF_DIR}}'
    cmds:
      - tofu validate

  state:list:
    desc: List resources in state
    dir: '{{.TF_DIR}}'
    cmds:
      - op run --env-file ../../.env -- tofu state list

  clean:
    desc: Clean up generated files
    cmds:
      - rm -rf environments/*/.terraform
      - rm -f environments/*/tfplan
      - rm -f environments/*/.terraform.lock.hcl

  lint:
    desc: Run the full pre-commit hook set (Terraform, Ansible, secrets, YAML, workflow lint)
    cmds:
      - pre-commit run --all-files

  ansible:install:
    desc: Install the pinned Ansible collection dependencies
    dir: ansible
    cmds:
      - ansible-galaxy collection install -r collections/requirements.yml

  ansible:check:
    desc: Lint + syntax-check the migrated Ansible playbooks (static, no live connections)
    cmds:
      # Reuses the pre-commit-managed ansible-lint install (see
      # .pre-commit-config.yaml) instead of assuming a bare `ansible-lint`
      # on PATH — ansible-core is available globally on this repo's
      # dev machines, but ansible-lint isn't.
      - pre-commit run ansible-lint --all-files
      # Deliberately -i inventory.yml (static), NOT netbox_inventory.yml,
      # even though ansible:run below uses the dynamic source now:
      # --syntax-check still resolves the inventory to validate each
      # play's `hosts:` pattern, so pointing this at the dynamic source
      # would turn a "static, no live connections" check into one that
      # needs NETBOX_TOKEN + real NetBox reachability -- contradicting
      # what this task's own desc promises. Static stays static.
      - >-
        cd ansible && ansible-playbook -i inventory.yml --syntax-check
        playbooks/freeipa-autopatch.yml
        playbooks/freeipa-metrics.yml
        playbooks/freeipa-rsyslog.yml
        playbooks/nixos-freeipa-vm.yml
        playbooks/unifi-network.yml
        playbooks/netbox-import.yml

  ansible:run:
    desc: >-
      Run a migrated playbook against real infrastructure. 1Password creds
      resolve via op run, matching this repo's Terraform convention.
      Usage: task ansible:run -- playbooks/unifi-network.yml [ansible-playbook args...]
      Add --check --diff for a dry run (e.g. against the live FreeIPA VM / UDM).
    dir: ansible
    cmds:
      # -i netbox_inventory.yml as of 2026-08-25 -- see that file's header
      # for the cutover story and the group-name-collision near-miss it
      # caught. Fall back to `-i inventory.yml` (still present, not
      # deleted) if NetBox itself is ever the thing that's down.
      - op run --env-file ../.env -- ansible-playbook -i netbox_inventory.yml {{.CLI_ARGS}}
