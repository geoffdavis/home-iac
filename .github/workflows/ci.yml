name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Lint only, on GitHub-hosted runners -- no self-hosted runner or secrets
# configured for this repo yet (checked live 2026-08-25: neither exists).
# terraform_validate runs with -backend=false (see .pre-commit-config.yaml),
# so no cloud credentials are needed here; live plan/apply stays a local
# `task plan`/`task apply` (op run-injected credentials), not CI.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # terraform_fmt/terraform_validate shell out to a real `tofu` binary
      # (--hook-config=--tf-path=tofu) -- pre-commit's own hook environment
      # doesn't provide one.
      - uses: opentofu/setup-opentofu@592200bd4b9bbf4772ace78f887668b1aee8f716 # v1.0.5
        with:
          tofu_wrapper: false

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
