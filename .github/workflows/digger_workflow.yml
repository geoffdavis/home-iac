name: Digger Workflow

on:
  workflow_dispatch:
    inputs:
      spec:
        required: true
      run_name:
        required: false

run-name: '${{inputs.run_name}}'

jobs:
  digger-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # required to merge PRs
      actions: write        # required for plan persistence
      id-token: write       # required for workload-identity-federation
      pull-requests: write  # required to post PR contents
      issues: read          # required to check if PR number is an issue or not
      statuses: write       # required to validate combined PR status

    steps:
      # persist-credentials: false -- digger's own checkout step
      # (invoked from inside diggerhq/digger below) sets its own git
      # auth header; leaving this step's credentials persisted causes
      # a "Duplicate header: Authorization" 400 when digger fetches.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: ${{ fromJSON(github.event.inputs.spec).job_id }}
        run: echo "job id ${{ fromJSON(github.event.inputs.spec).job_id }}"
      - uses: diggerhq/digger@vLatest
        with:
          digger-spec: ${{ inputs.spec }}
          setup-opentofu: true
          opentofu-version: 1.9.1
          setup-aws: true
          aws-region: us-west-2
          aws-role-to-assume: ${{ vars.AWS_DIGGER_ROLE_ARN }}
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
