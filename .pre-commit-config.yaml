repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
      # Jinja `{{ }}` inside a plain YAML scalar (every Ansible var
      # default, every host_vars template string) is valid YAML text on
      # its own -- this only catches genuinely broken syntax, not
      # templating. No excludes needed.
      - id: check-yaml
      # This repo's roles handle real SSH keys and FreeIPA/UDM
      # credentials (via 1Password op run, never committed) -- this is
      # the backstop for the day someone pastes a key into the wrong
      # file by mistake.
      - id: detect-private-key

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.99.1
    hooks:
      - id: terraform_fmt
        args:
          - --args=-diff
          - --hook-config=--tf-path=tofu
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
          - --hook-config=--tf-path=tofu
          - --tf-init-args=-backend=false

  # Ansible linting for the ansible/ tree (Task 1 of
  # docs/superpowers/plans/2026-08-21-netbox-udm-sync.md). ugreen-nas-compose,
  # where these roles were migrated from, never wired up ansible-lint at
  # all — see .ansible-lint's header comment for why the rule set here is
  # deliberately loose for now.
  - repo: https://github.com/ansible/ansible-lint
    # Pinned to the last release whose pre-commit hook manifest requests
    # python3.14 (v26.2.0+ requires it; this repo's dev toolchain currently
    # provides up to python3.13 via nix). Bump once python3.14 is available,
    # or once a future ansible-lint release relaxes the pin.
    rev: v26.1.1
    hooks:
      - id: ansible-lint
        files: ^ansible/
        # pre-commit hooks run from the repo root, but the playbooks live
        # at ansible/playbooks/ and reference roles by name (roles_path =
        # roles in ansible/ansible.cfg, relative to ansible/). Without
        # --project-dir, ansible-lint's default role search resolves
        # relative to the repo root instead and fails every playbook with
        # syntax-check[specific]: role not found.
        args: [--project-dir, ansible]

  # YAML style outside ansible/ (Taskfile.yml, .github/workflows/, this
  # file itself) -- ansible-lint already owns YAML style inside ansible/
  # via its own embedded yamllint rules; see .yamllint.yml's ignore list.
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint

  # Secret scan on staged content, redacted output -- closes the window
  # between a commit landing locally and GitGuardian's server-side scan
  # (post-push) catching the same thing. Matches nix-personal's own
  # pre-commit convention.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  # Lints .github/workflows/ci.yml and any future workflow files --
  # pre-commit provisions its own golang toolchain for this hook, no
  # system Go install required.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
